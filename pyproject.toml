[project]
name = "pq-cap-bench"
version = "0.1.0"
description = "Post-quantum signature cost and LoRaWAN / NB-IoT delivery model for capability tokens"
readme = "README.md"
authors = [
    { name = "gedji2024", email = "georges-parfait.djimefo-kapen@etud.polymtl.ca" }
]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50.0.2",
    "liboqs-python",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
pqcap = "pqcap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pqcap"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pqcap"]
# Coverage target = model code (radio, token, schemes, kill-criteria logic).
# The timing harness, env capture, CLI glue and plotting are exercised by `make all`.
omit = ["*/pqcap/bench.py", "*/pqcap/env.py", "*/pqcap/cli.py", "*/pqcap/figures.py", "*/pqcap/oqs_loader.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.uv.sources]
liboqs-python = { git = "https://github.com/open-quantum-safe/liboqs-python.git", rev = "0.16.0.2" }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
