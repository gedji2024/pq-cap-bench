# Harm-weighted replay (pqcap.harm). Stage series: USGS NWIS, cached raw in data/ with its
# query URL and retrieval date in the matching .meta.json (scripts/fetch_usgs.py).
#
# Sources: [K26] Kerkez et al., ACM DXConf 2026, doi:10.1145/3847238.3849040, Sec. 4.1.
# Anything not marked [K26] or USGS is "assumed -- pending field profile".

series:
  file: data/usgs_08074000_00065_2017-08-26_2017-08-31.json   # Buffalo Bayou at Houston, TX; gage height, ft
  ft_to_cm: 30.48                                             # unit conversion (exact by definition)
  interpolation: linear                                       # between USGS readings, incl. data gaps -- assumed

device:
  sample_period_min: 10              # [K26] "wake to sample every ten minutes on average"
  default_reporting_interval_min: 60 # [K26] "buffer readings before transmitting hourly"
  alert_threshold_cm: 610            # 20.0 ft -- assumed -- pending field profile
  min_uplink_spacing_min: 2          # modem cycle floor for back-to-back uplinks -- assumed
  # Envelope renewal (Sec. 7d) is assumed to succeed throughout the replay, so validity never lapses here.

# D5: battery from MANUFACTURER data (config/devices/*.yaml); replaces the earlier "drains in a week"
# interpretation of Kerkez et al. (superseded). Values without a manual source are labelled ASSUMED.
battery:
  initial_soc_pct: 60                # ASSUMED -- pending field profile
  profiles:
    - name: PS-LB/good               # 14 dBm, EU868 uplink DR5 = SF7/125 kHz [RP002 Table 8]
      device: PS-LB
      model: charge                  # capacity + sleep current + tx current x uplink time-on-air
      tx_condition: "14 dBm"
      uplink_phy: {sf: 7, bw_khz: 125, cr: 1, preamble: 8, crc_on: true}   # RP002 Table 109: uplink CRC on
    - name: PS-LB/poor               # 20 dBm, US915 uplink DR0 = SF10/125 kHz [RP002 Table 16]
      device: PS-LB
      model: charge
      tx_condition: "20 dBm"
      uplink_phy: {sf: 10, bw_khz: 125, cr: 1, preamble: 8, crc_on: true}
    - name: LWL01/good
      device: LWL01
      model: uplink_budget           # battery = the manual's uplink count; sleep drain ASSUMED 0 (capacity not stated)
      condition: "good coverage, EU868, SF7"
    - name: LWL01/poor
      device: LWL01
      model: uplink_budget
      condition: "poor coverage, US915, SF10 max power"
  not_derivable: [EM400-UDL, EM410-RDL]   # manuals give no per-uplink charge, current or uplink count
  assumed:
    - "initial state of charge"
    - "PS-LB: RX windows, MCU and probe-excitation charge excluded (charge per uplink is a LOWER bound)"
    - "LWL01: sleep drain neglected (no capacity given to convert 5 uA into a battery fraction)"

# D4: events selected by RULE from cached USGS annual series (scripts/fetch_usgs.py; query URL, date and SHA-256
# in each data/*.meta.json). Gauge-year choice: Buffalo Bayou 2017 (contains Hurricane Harvey, project
# requirement); Huron River at Ann Arbor (the Kerkez et al. 2026 watershed) and Potomac River at Little Falls,
# same calendar year. top_k / separation / window are selection parameters, not data.
# SUPERSEDED by F5 (events_prereg below): the 2017 top-k rule, kept for the record and not run.
superseded_events_rule:
  gauges:
    - {usgs: "08074000", site: "USGS 08074000 Buffalo Bayou at Houston, TX", file: data/usgs_08074000_00065_2017-01-01_2017-12-31.json}
    - {usgs: "04174500", site: "USGS 04174500 Huron River at Ann Arbor, MI", file: data/usgs_04174500_00065_2017-01-01_2017-12-31.json}
    - {usgs: "01646500", site: "USGS 01646500 Potomac River near Wash, DC Little Falls", file: data/usgs_01646500_00065_2017-01-01_2017-12-31.json}
  top_k: 2
  separation_days: 14
  half_window_days: 3
# F4: NWS flood categories (action, minor, moderate, major) from the NWS National Water Prediction Service,
# cached raw in data/nws/ by scripts/fetch_nws.py (query URL, gauge page, retrieval date, SHA-256 in the
# .meta.json). Used for scoring levels, the legitimate alert threshold (= action stage, CHOICE) and the
# envelope threshold band (POLICY: [action - (minor - action), minor]). A gauge is used only if NWS stage and
# USGS gage height agree within datum_tol_ft at the latest common reading (datum check, CHOICE of tolerance).
# Gauges without NWS categories keep the fraction rule below (ASSUMED).
nws: {dir: data/nws, datum_tol_ft: 0.5}
# F3: S6+F commissioning bound per event: maximum alert threshold = that gauge's NWS action stage (write-once).
commissioning: {max_alert_threshold: nws_action}
# F5: events selected by the PRE-REGISTERED rule in config/events_prereg.yaml (committed before the data were
# fetched) from 10 years of USGS IV data per gauge, cached gzipped in data/usgs10/ with per-file meta.
events_prereg: {file: config/events_prereg.yaml, data_dir: data/usgs10}
workers: 8                 # parallel replay processes (results do not depend on it)
statistics: {bootstrap: 10000, seed: 20261104, ci: 0.95,
             # G4: events whose peaks lie within this many hours of each other on any gauge form one storm cluster
             # (single linkage, CHOICE = the 72 h event separation of the pre-registered rule); the F5 CIs resample
             # whole clusters, superseding the event-level bootstrap. The same unit is used in Task E.
             cluster_window_h: 72}
# G3: energy budget per epoch in the envelope (POLICY). Per epoch, at most `epoch_budget_uplinks` command-caused
# uplinks (immediate-uplink requests, or uplinks sooner than the default interval with the invariants applied);
# firmware alert uplinks and the alert-mode minimum rate are never charged. Budget per battery profile =
# ((initial SOC - battery floor) x capacity - sleep over horizon) / charge per uplink / epochs in horizon
# - default-schedule uplinks per epoch (pqcap.harm.epoch_budget; inputs ASSUMED). horizon_d = 7 = the
# pre-registered event window (5 d before + 2 d after the peak), i.e. the envelope's planning horizon (CHOICE).
# The budget sits in the S6/S4-E/S6+F envelope (lost when C1+C3 replaces it) and, for S6+F, also in the
# write-once commissioning floor (`in_floor`), so it survives C1+C3.
energy_budget:
  variants: ["off", "on"]        # quoted: YAML 1.1 reads bare off/on as booleans
  schemes: [S4-E, S6, S6+F]
  in_floor: [S6+F]
  epoch_h: 24
  horizon_d: 7

# Scoring. Gauges differ in stage scale, so thresholds are FRACTIONS of each event's own stage range (ASSUMED).
harm:
  reference_levels_ft: null               # absolute levels (single-gauge mode); superseded by fractions below
  reference_level_fractions: [0.25, 0.5, 0.75, 0.9]   # ASSUMED
  relative:
    alert_fraction: 0.5                   # legitimate device alert threshold -- ASSUMED
    envelope_band: [0.35, 0.65]           # S6/S4-E envelope bounds for set_alert_threshold -- ASSUMED (POLICY)
  delay_tolerance_min: 30                 # a crossing reported later than this is "delayed" -- ASSUMED

# Rule-based adaptive-reporting policy run by the legitimate platform ([K26] Sec. 6 pattern:
# ramp up on rise, step down when steady).
legit_policy:
  fast_interval_min: 10              # assumed
  slow_interval_min: 60              # = default hourly reporting [K26]
  rise_cm_per_h: 15                  # ramp up when the reported stage rises faster than this -- assumed
  steady_cm_per_h: 3                 # step down when |rate| stays below this ... -- assumed
  steady_reports: 3                  # ... for this many consecutive reports -- assumed
  # D3: naive asks for its target regardless of limits; limit_aware asks for the closest value the device
  # would accept now (envelope limits are public; the device state is what the PDP last observed).
  variants: [naive, limit_aware]

# Attacker strategies (each opportunity: the most harmful command the device would accept, chosen with
# the same pure check function the device runs -- the policy is not secret).
attacker:
  strategies: [suppress, drain]
  # suppress: disable sensor > raise alert threshold to max accepted > slowest accepted reporting interval
  # drain:    fastest accepted reporting interval > immediate uplink at every opportunity
compromises: [none, C1, C1+C3, C1+C3+OP]  # none = legitimate policy only; C1+C3 keeps the OP key safe (D2)
schemes: [S4, S4-F, S4-E, S6, S6+F]
