# Harm-weighted replay (pqcap.harm). Stage series: USGS NWIS, cached raw in data/ with its
# query URL and retrieval date in the matching .meta.json (scripts/fetch_usgs.py).
#
# Sources: [K26] Kerkez et al., ACM DXConf 2026, doi:10.1145/3847238.3849040, Sec. 4.1.
# Anything not marked [K26] or USGS is "assumed -- pending field profile".

series:
  file: data/usgs_08074000_00065_2017-08-26_2017-08-31.json   # Buffalo Bayou at Houston, TX; gage height, ft
  ft_to_cm: 30.48                                             # unit conversion (exact by definition)
  interpolation: linear                                       # between USGS readings, incl. data gaps -- assumed

device:
  sample_period_min: 10              # [K26] "wake to sample every ten minutes on average"
  default_reporting_interval_min: 60 # [K26] "buffer readings before transmitting hourly"
  alert_threshold_cm: 610            # 20.0 ft -- assumed -- pending field profile
  min_uplink_spacing_min: 2          # modem cycle floor for back-to-back uplinks -- assumed
  # Envelope renewal (Sec. 7d) is assumed to succeed throughout the replay, so validity never lapses here.

# D5: battery from MANUFACTURER data (config/devices/*.yaml); replaces the earlier "drains in a week"
# interpretation of Kerkez et al. (superseded). Values without a manual source are labelled ASSUMED.
battery:
  initial_soc_pct: 60                # ASSUMED -- pending field profile
  profiles:
    - name: PS-LB/good               # 14 dBm, EU868 uplink DR5 = SF7/125 kHz [RP002 Table 8]
      device: PS-LB
      model: charge                  # capacity + sleep current + tx current x uplink time-on-air
      tx_condition: "14 dBm"
      uplink_phy: {sf: 7, bw_khz: 125, cr: 1, preamble: 8, crc_on: true}   # RP002 Table 109: uplink CRC on
    - name: PS-LB/poor               # 20 dBm, US915 uplink DR0 = SF10/125 kHz [RP002 Table 16]
      device: PS-LB
      model: charge
      tx_condition: "20 dBm"
      uplink_phy: {sf: 10, bw_khz: 125, cr: 1, preamble: 8, crc_on: true}
    - name: LWL01/good
      device: LWL01
      model: uplink_budget           # battery = the manual's uplink count; sleep drain ASSUMED 0 (capacity not stated)
      condition: "good coverage, EU868, SF7"
    - name: LWL01/poor
      device: LWL01
      model: uplink_budget
      condition: "poor coverage, US915, SF10 max power"
  not_derivable: [EM400-UDL, EM410-RDL]   # manuals give no per-uplink charge, current or uplink count
  assumed:
    - "initial state of charge"
    - "PS-LB: RX windows, MCU and probe-excitation charge excluded (charge per uplink is a LOWER bound)"
    - "LWL01: sleep drain neglected (no capacity given to convert 5 uA into a battery fraction)"

# Operator reference levels used to score detection (missed / delayed upward crossings).
harm:
  reference_levels_ft: [10, 20, 30, 40]   # assumed -- pending field profile
  delay_tolerance_min: 30                 # a crossing reported later than this is "delayed" -- assumed

# Rule-based adaptive-reporting policy run by the legitimate platform ([K26] Sec. 6 pattern:
# ramp up on rise, step down when steady).
legit_policy:
  fast_interval_min: 10              # assumed
  slow_interval_min: 60              # = default hourly reporting [K26]
  rise_cm_per_h: 15                  # ramp up when the reported stage rises faster than this -- assumed
  steady_cm_per_h: 3                 # step down when |rate| stays below this ... -- assumed
  steady_reports: 3                  # ... for this many consecutive reports -- assumed
  # D3: naive asks for its target regardless of limits; limit_aware asks for the closest value the device
  # would accept now (envelope limits are public; the device state is what the PDP last observed).
  variants: [naive, limit_aware]

# Attacker strategies (each opportunity: the most harmful command the device would accept, chosen with
# the same pure check function the device runs -- the policy is not secret).
attacker:
  strategies: [suppress, drain]
  # suppress: disable sensor > raise alert threshold to max accepted > slowest accepted reporting interval
  # drain:    fastest accepted reporting interval > immediate uplink at every opportunity
compromises: [none, C1, C1+C3, C1+C3+OP]  # none = legitimate policy only; C1+C3 keeps the OP key safe (D2)
schemes: [S4, S4-F, S4-E, S6, S6+F]
