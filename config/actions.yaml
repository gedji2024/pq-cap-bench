# Device action profile for the blast-radius (K5/K6) and harm metrics.
#
# ACTION TYPES follow Kerkez, Watteyne, Tobias, Andersen, Prater, "Toward Agent-Native Water
# Systems", ACM DXConf 2026, doi:10.1145/3847238.3849040 (Sec. 4.1: one ultrasonic depth sensor per
# node, cellular modem; Sec. 6: adaptive reporting -- ramp reporting up on rise, step down when
# steady, "the sensor battery should never die"; alerts by email/text).
# The paper is cited for the action TYPES only.
#
# EVERY NUMERIC VALUE BELOW IS "assumed -- pending field profile": it is not taken from the paper,
# from a specification, or from a measurement. Replace with the deployment's real profile.

source_for_action_types: "Kerkez et al. 2026, ACM DXConf, doi:10.1145/3847238.3849040, Sec. 4.1 and Sec. 6"
status: "assumed -- pending field profile"

# Command space = (action, target, integer value). One depth sensor per node -> 1 target.
catalogue:
  set_reporting_interval:   {id: 1, targets: 1, min: 1, max: 1440, unit: min}    # assumed -- pending field profile
  request_immediate_uplink: {id: 2, targets: 1, min: 0, max: 0,    unit: none}   # assumed -- pending field profile
  sensor_enable:            {id: 3, targets: 1, min: 0, max: 1,    unit: "0=disable,1=enable"}  # assumed
  set_alert_threshold:      {id: 4, targets: 1, min: 0, max: 1500, unit: cm of stage}           # assumed

# Physical invariants (state-dependent), enforced on the device by S6 / S4-E (in the envelope)
# and by S4-F (in firmware). S4 enforces none.
invariants:
  alert_max_interval_min: 15        # min reporting rate during an active alert -- assumed -- pending field profile
  alert_forbid_disable: true        # sensor cannot be disabled during an active alert -- assumed
  battery_floor_soc_pct: 20         # battery floor (state of charge) -- assumed -- pending field profile
  low_battery_min_interval_min: 120 # below the floor, no faster reporting than this -- assumed
  low_battery_block_immediate_uplink: true                                      # assumed

# S6 / S4-E crisis envelope: what the policy authority pre-authorises for an event.
# Omitted actions are forbidden. targets = allowed target indices; [lo, hi] inclusive.
envelope:
  handle: 42                                                            # arbitrary identifier
  rules:
    set_reporting_interval:   {targets: [0], lo: 5,   hi: 60}           # assumed -- pending field profile
    request_immediate_uplink: {targets: [0], lo: 0,   hi: 0}            # assumed
    sensor_enable:            {targets: [0], lo: 1,   hi: 1}            # enable only -- assumed
    set_alert_threshold:      {targets: [0], lo: 460, hi: 760}          # 15.1-24.9 ft -- assumed

# S4-F: static bounds hard-coded in firmware at manufacture (not updatable over the air). They must
# cover every legitimate operating mode for the device's lifetime, so they are wider than an
# event envelope. The same physical invariants are hard-coded.
firmware_bounds:
  rules:
    set_reporting_interval:   {targets: [0], lo: 5,   hi: 720}          # assumed -- pending field profile
    request_immediate_uplink: {targets: [0], lo: 0,   hi: 0}            # assumed
    sensor_enable:            {targets: [0], lo: 0,   hi: 1}            # maintenance needs disable -- assumed
    set_alert_threshold:      {targets: [0], lo: 150, hi: 1500}         # assumed

# Device state in which blast radius is counted (K5/K6). All four combinations go to the CSV.
count_state: {alert_active: true, battery_above_floor: true}

# F3: write-once commissioning bounds of the S6+F firmware floor (set once at installation, never updatable over
# the air, so they survive C1+C3). Maximum alert threshold = the NWS ACTION stage of the gauge (F4 data, CHOICE of
# category); for this profile (Buffalo Bayou, envelope band 15.1-24.9 ft) that is NWS BBST2. The maximum
# reporting interval while in alert is invariants.alert_max_interval_min (ASSUMED, unchanged).
commissioning:
  max_alert_threshold_nws: {usgs: "08074000", category: action}
