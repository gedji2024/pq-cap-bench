# Dragino LWL01 (LoRaWAN water leak sensor). Official PDF from Dragino's download server.
device: {manufacturer: Dragino, model: LWL01}
docs:
  main: {title: "LWL01 – LoRaWAN Water Leak User Manual", version: "1.3.1 (revision table, file name); cover prints 1.3.0",
         release_date: "2021-Jun-3", url: "https://www.dragino.com/downloads/downloads/LoRa_End_Node/LDS01/LWL01_LoRaWAN_Water_Leak_UserManual_v1.3.1.pdf",
         accessed: 2026-11-04, sha256: f2a87dc8a80e3d3e7e2f1f73a3e742982543fe1975f08d842e979eed8b186572}
  at: {title: "Dragino LDS01, LWL01 LoRaWAN Module AT Command Sets", version: "V1.2", release_date: "2020-08-01",
       url: "https://www.dragino.com/downloads/downloads/LoRa_End_Node/LDS01/AT_Commands_LDS01_LWL01_v1.2.pdf", accessed: 2026-11-04,
       sha256: e5ce531861fc43a9313d413584c9060abde84c3761c5fabe83cd0582dc51e75e}
downlink_fport: {value: null, status: "NOT FOUND"}
byte_order: {value: big, status: "inferred from example", source: {doc: main, section: "3.4 Downlink Payload", page: 12,
             quote: "If the payload=0100003C, means to control the LWL01’s Keep Alive interval to 0x00003C=60(S)"}}
battery:
  capacity_mAh: null
  battery_type: {value: CR2032, source: {doc: main, section: "3.7 Battery", page: 16, quote: "LWL01 is powered by a CR2032 coin battery"}}
  sleep_uA: {value: 5, source: {doc: main, section: "3.7 Battery", page: 16,
             quote: "when running in deep sleep mode, the device power consumption is ~5uA."}}
  tx_mA: null
  uplinks_per_battery:
    - {value: 12000, condition: "good coverage, EU868, SF7", source: {doc: main, section: "3.7 Battery", page: 16,
       quote: "In good network coverage and EU868 band, the device will transmit at SF7, and can uplink as many as 12,000 messages."}}
    - {value: 1300, condition: "poor coverage, US915, SF10 max power", source: {doc: main, section: "3.7 Battery", page: 16,
       quote: "In poor network coverage and US915 band. The device will transmit at SF10 at max power. in this case, it can uplink about ~1,300 messages."}}
  lifetime_claim: {value_years: 2, conditions: "design goal", source: {doc: main, section: "1.1 What is LWL01 LoRaWAN Water Leak Sensor", page: 3,
                   quote: "The design goal for one battery is up to 2 years."}}
actions:
  - action: set_reporting_interval
    command: "01"
    payload_bytes: 4
    dims: [{name: interval, unit: s, min: 0, max: 16777215, range_source: encoding, note: "3-byte value; no documented min/max"}]
    default: {value: 86400, unit: s, source: {doc: at, section: "AT+TDC", quote: "Application Data Transmission Interval< The default TDC is 86400 s>"}}
    source: {doc: main, section: "3.4 Downlink Payload", page: 12, quote: "TDC (Transmit Time Interval—Keep Alive Interval) 0x01 4"}
  - action: alarm_disable
    command: "A7 01"
    payload_bytes: 2
    dims: []
    source: {doc: main, section: "3.4 Downlink Payload", page: 13, quote: "0xA7 01 : Equal to AT+DISALARM=1"}
  - action: alarm_enable
    command: "A7 00"
    payload_bytes: 2
    dims: []
    source: {doc: main, section: "3.4 Downlink Payload", page: 13, quote: "0xA7 00 : Equal to AT+DISALARM=0"}
  - action: set_dr
    command: "A8 aa bb"
    payload_bytes: 3
    dims:
      - {name: adr, unit: flag, min: 0, max: 1, range_source: downlink_table}
      - {name: dr, unit: DR, min: 0, max: 5, range_source: app_setting, note: "DR list of AT+CDATARATE"}
    source: {doc: main, section: "3.4 Downlink Payload", page: 13,
             quote: "Format: 0xA8 aa bb aa: 1: Enable ADR; 0: Disable ADR (Same as AT+CADR command) bb: set DR (Same as AT+CDATARATE ,only valid after ADR=0)"}
    ambiguity: "example 'A8 00 02 : Set ADR=0 and DR=1' contradicts itself"
  - action: reboot
    command: "04 FF"
    payload_bytes: 2
    dims: []
    source: {doc: main, section: "3.4 Downlink Payload", page: 12, quote: "If payload = 0x04FF, it will reset the LWL01."}
not_found: ["downlink FPort", "min/max of TDC", "battery capacity (CR2032 mAh)", "transmit current",
            "command to change the 10-min in-leak update interval", "collection interval", "alarm threshold command"]
