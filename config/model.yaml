# Delivery-model scenario parameters.
signature_size_statistic: max      # which observed signature size to use: min | median | max
fragment_header_bytes: 2
uplink_interval_s: 300             # Class A: one downlink opportunity per uplink
windows_min: [15, 30, 60, 120]
devices_per_gateway: [10, 50, 200]
epoch_hours: [1, 6, 24]            # S2: epoch certificate period T
s2_kem: [ML-KEM-512, ML-KEM-768]   # S2 key-establishment ciphertext source (measured via liboqs)
s2_cert_signer: ML-DSA-44          # S2 epoch certificate signature algorithm
s2_epoch_cert_fields:              # unsigned body of the S2 epoch certificate (bytes, summed)
  version: 1
  alg_id: 1
  epoch_id: 8
  validity_window: 12
  device_id: 8
  sym_key_id: 8
  issuer_key_id: 8
s2_commands_per_epoch: [1, 10, 100]  # amortisation points; the Class A maximum is also reported
hmac_label: HMAC-SHA256-T16        # S2/S4 per-command tag (measured algorithm label)
hybrid_label: ECDSA-P256+ML-DSA-44
classical_label: ECDSA-P256

# Per-scheme PQ algorithms evaluated for S1 (labels from config/bench.yaml).
s1_algorithms: [ML-DSA-44, ML-DSA-65, ML-DSA-87, Falcon-512, Falcon-1024,
                SLH-DSA-SHA2-128s, SLH-DSA-SHA2-128f, XMSS-SHA2-10-256]

eu868_duty_cycle: 0.01             # gateway downlink duty cycle (configurable; see README on RX2 sub-band)
nbiot_max_payload_bytes: 1280      # NB-IoT application payload per downlink (configurable default)

kill_criteria:
  K1: {scheme: S1, algorithm: ML-DSA-44, window_min: 30, devices: 50, region: US915, dr: 8, depth: 0}
  K2: {near_symmetric_ratio: 2.0}  # S2/S4 per-command airtime ratio considered "near-symmetric"
  K4: {region: US915}              # S6 crisis command fits one frame at every downlink DR of this region

# D2: candidate signature algorithms for the OP approval token (sk_OP is distinct from sk_PA; no choice is
# imposed, the size of each measured algorithm is reported)
d2_op_token_algorithms: [Ed25519, Falcon-512, ML-DSA-44]
# F6: pre-committed OP approvals (hash chain bound to device and action). Field sizes are DESIGN CHOICES:
#   reveal = one chain element (16 or 32 B); the disable command = crisis fields + first tag length (s6 below);
#   commitment = device id 4 B + action 1 B + chain length 2 B + top 32 B (SHA-256), plus one OP signature.
f6_op_chain:
  reveal_bytes: [16, 32]
  commit_fields: {device_id: 4, action: 1, chain_length: 2, top: 32}

# S4-E envelope authenticator: HMAC-SHA256 (full 32-B tag, measured algorithm label) under a per-device key
s4e_envelope_mac: HMAC-SHA256-T32

# Channels shown in the per-channel figures (all channels are always in the CSVs).
figure_channels: [[US915, 8], [US915, 13], [EU868, 0], [EU868, 5]]
figure_depth_algorithms: [ML-DSA-44, Falcon-512, SLH-DSA-SHA2-128f]  # S1 lines in the depth figure

# S6 "pre-positioned capability envelopes".
# Calm phase: one PQ-signed envelope per device, delivered during a calm period P before the event.
# Crisis phase: compact per-command message authenticated by a truncated HMAC-SHA256 tag and
# checked by the device against the envelope bounds. Tag length is a design parameter (truncation),
# not a measured value; HMAC timing is in results/bench_summary.csv (HMAC-SHA256-T16).
s6:
  envelope_fields: {header: 16, bounds: 64, invariants: 32}
  signers: [ML-DSA-44, Falcon-512]           # envelope signature algorithms (measured sizes)
  calm_period_hours: [6, 24, 72]
  crisis_fields: {envelope_handle: 4, counter: 4, params: 8}
  tag_bytes: [8, 16]
  crisis_windows_min: [15, 30, 60]
  # S4 is compared like-for-like inside the crisis table (full token and compact format, same tag lengths)
  compare: [[S1, ML-DSA-44], [S1, Falcon-512], [S2, ML-DSA-44+KEM/HMAC-SHA256-T16]]

# Revocation / renewal of S6 and S4-E envelopes (modelling parameters).
revocation:
  validity_hours: [6, 24, 72]      # envelope validity V; firmware caps any envelope at V (incl. attacker-minted)
  devices: [10, 50, 200]
  # Active revocation = the policy authority pushes a replacement (empty-bounds) envelope over its own
  # downlink path (assumed independent of the compromised cloud platform).
  active_push: true
  # D1 S6-R: envelope carries H(r_rev) (32 B, SHA-256); revocation reveals r_rev (16 or 32 B) + handle (4 B)
  s6r_reveal_bytes: [16, 32]

# D6: gateway-side filtering of a C1 command flood (pqcap.gateway).
d6:
  # Original D6 point, kept as an UPPER BOUND: the filtering gateway is given AppSKey (confidentiality only).
  gateway_reads_parameters: "gateway given AppSKey (upper bound) -- ASSUMED, not standard LoRaWAN; integrity key k_{d,e} is not given"
  # F2: filtering points LoRaWAN allows. Source: LoRa Alliance TS001-1.0.4 "LoRaWAN L2 1.0.4 Specification",
  # https://lora-alliance.org/wp-content/uploads/2021/11/LoRaWAN-Link-Layer-Specification-v1.0.4.pdf
  # (accessed 2026-11-04, SHA-256 d193a4124e984bdfd608a920d7a428b62cbe717171e6fb7e066ab482baad75a5):
  #  Sec. 1   "gateways relay transmissions between end-devices and a central Network Server"
  #  Sec. 6.1.2 NwkSKey "is used by both the Network Server and the end-device to calculate and verify the MIC
  #           ... of all data frames"; Sec. 6.1.3 AppSKey "is used by both the Application Server and the
  #           end-device"; "Application payloads SHALL be encrypted end-to-end between the end-device and the
  #           Application Server"
  #  Sec. 4.3.3 Table 11: FRMPayload key K = NwkSKey if FPort = 0, AppSKey if FPort = 1..255
  # Consequence: the NS sees DevAddr, FCnt, FPort (clear, MIC-covered) and the FRMPayload length; no
  # application frame can carry parameters in clear, so an "in clear, integrity-protected" field can only
  # be the FPort itself (fport_action_binding: one FPort per action, enforced by the device firmware --
  # a firmware change, since Milesight uses one FPort (85) for every command).
  filter_points: [appskey_upper_bound, ns_metadata, fport_action_binding]
  flood_mixes: [uniform_payload, uniform_type]   # attacker draws commands uniformly over payloads / over types
  devices_per_gateway: [10, 50, 200]
  # G1: bounds-source table (filter point x scheme x how the NS learns the bounds) at one operating point
  bounds_source: {region: US915, dr: 8, devices: 50, policy: tight, mix: uniform_type}
