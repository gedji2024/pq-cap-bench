# Delivery-model scenario parameters.
signature_size_statistic: max      # which observed signature size to use: min | median | max
fragment_header_bytes: 2
uplink_interval_s: 300             # Class A: one downlink opportunity per uplink
windows_min: [15, 30, 60, 120]
devices_per_gateway: [10, 50, 200]
epoch_hours: [1, 6, 24]            # S2: epoch certificate period T
s2_kem: [ML-KEM-512, ML-KEM-768]   # S2 key-establishment ciphertext source (measured via liboqs)
s2_cert_signer: ML-DSA-44          # S2 epoch certificate signature algorithm
s2_epoch_cert_fields:              # unsigned body of the S2 epoch certificate (bytes, summed)
  version: 1
  alg_id: 1
  epoch_id: 8
  validity_window: 12
  device_id: 8
  sym_key_id: 8
  issuer_key_id: 8
s2_commands_per_epoch: [1, 10, 100]  # amortisation points; the Class A maximum is also reported
hmac_label: HMAC-SHA256-T16        # S2/S4 per-command tag (measured algorithm label)
hybrid_label: ECDSA-P256+ML-DSA-44
classical_label: ECDSA-P256

# Per-scheme PQ algorithms evaluated for S1 (labels from config/bench.yaml).
s1_algorithms: [ML-DSA-44, ML-DSA-65, ML-DSA-87, Falcon-512, Falcon-1024,
                SLH-DSA-SHA2-128s, SLH-DSA-SHA2-128f, XMSS-SHA2-10-256]

eu868_duty_cycle: 0.01             # gateway downlink duty cycle (configurable; see README on RX2 sub-band)
nbiot_max_payload_bytes: 1280      # NB-IoT application payload per downlink (configurable default)

kill_criteria:
  K1: {scheme: S1, algorithm: ML-DSA-44, window_min: 30, devices: 50, region: US915, dr: 8, depth: 0}
  K2: {near_symmetric_ratio: 2.0}  # S2/S4 per-command airtime ratio considered "near-symmetric"
  K4: {region: US915}              # S6 crisis command fits one frame at every downlink DR of this region

# Channels shown in the per-channel figures (all channels are always in the CSVs).
figure_channels: [[US915, 8], [US915, 13], [EU868, 0], [EU868, 5]]
figure_depth_algorithms: [ML-DSA-44, Falcon-512, SLH-DSA-SHA2-128f]  # S1 lines in the depth figure

# S6 "pre-positioned capability envelopes".
# Calm phase: one PQ-signed envelope per device, delivered during a calm period P before the event.
# Crisis phase: compact per-command message authenticated by a truncated HMAC-SHA256 tag and
# checked by the device against the envelope bounds. Tag length is a design parameter (truncation),
# not a measured value; HMAC timing is in results/bench_summary.csv (HMAC-SHA256-T16).
s6:
  envelope_fields: {header: 16, bounds: 64, invariants: 32}
  signers: [ML-DSA-44, Falcon-512]           # envelope signature algorithms (measured sizes)
  calm_period_hours: [6, 24, 72]
  crisis_fields: {envelope_handle: 4, counter: 4, params: 8}
  tag_bytes: [8, 16]
  crisis_windows_min: [15, 30, 60]
  compare: [[S1, ML-DSA-44], [S1, Falcon-512], [S2, ML-DSA-44+KEM/HMAC-SHA256-T16], [S4, HMAC-SHA256-T16]]
